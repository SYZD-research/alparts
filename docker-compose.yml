services:
  postgres:
    image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-alparts}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # SeaweedFS (Apache-2.0) serves the S3 API.
  object-storage:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?S3_ADMIN_ACCESS_KEY must be set}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?S3_ADMIN_SECRET_KEY must be set}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      S3_BUCKET: ${S3_BUCKET:-alparts}
      AUDIT_HEAD_BUCKET: ${AUDIT_HEAD_BUCKET:-alparts-audit}
    volumes:
      - object_storage_data:/data
    # The administrator credentials create the buckets; the application gets
    # an identity limited to its two buckets.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        cat > /tmp/s3.json <<EOF
        {
          "identities": [
            {
              "name": "admin",
              "credentials": [{ "accessKey": "$${S3_ADMIN_ACCESS_KEY}", "secretKey": "$${S3_ADMIN_SECRET_KEY}" }],
              "actions": ["Admin", "Read", "List", "Tagging", "Write"]
            },
            {
              "name": "alparts-app",
              "credentials": [{ "accessKey": "$${S3_ACCESS_KEY}", "secretKey": "$${S3_SECRET_KEY}" }],
              "actions": [
                "Read:$${S3_BUCKET}", "Write:$${S3_BUCKET}", "List:$${S3_BUCKET}",
                "Read:$${AUDIT_HEAD_BUCKET}", "Write:$${AUDIT_HEAD_BUCKET}", "List:$${AUDIT_HEAD_BUCKET}"
              ]
            }
          ]
        }
        EOF
        chown seaweed:seaweed /tmp/s3.json
        exec /entrypoint.sh mini -dir=/data -s3.config=/tmp/s3.json \
          -bucket="$${S3_BUCKET},$${AUDIT_HEAD_BUCKET}" \
          -master.telemetry=false -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    healthcheck:
      test: ["CMD-SHELL", "echo s3.bucket.list | weed shell 2>/dev/null | grep -qE \"^[[:space:]]+$${AUDIT_HEAD_BUCKET}[[:space:]]\""]
      interval: 5s
      timeout: 10s
      retries: 24
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  object_storage_data:
