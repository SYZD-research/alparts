name: Android build and provenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'packages/android/**'
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'scripts/release/**'
      - 'pnpm-lock.yaml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.8.0'
          cache: pnpm
      # The committed gradle-wrapper.jar is executed below; verify it against
      # the published Gradle checksums first.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - name: Provide transport pins
        shell: bash
        env:
          CONFIGURED_PINS: ${{ vars.ALPARTS_TRANSPORT_PINS_JSON }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          pins_file="$RUNNER_TEMP/transport-pins.json"
          if [[ -n "$CONFIGURED_PINS" ]]; then
            printf '%s\n' "$CONFIGURED_PINS" > "$pins_file"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Build check only: random pins for a reserved name that never resolves,
            # so the package cannot connect anywhere and is never distributable.
            node -e 'const p=()=>require("node:crypto").randomBytes(32).toString("base64");console.log(JSON.stringify({version:1,hosts:{"ci-build-check.alparts.invalid":[p(),p()]}}))' > "$pins_file"
          else
            echo "Set the ALPARTS_TRANSPORT_PINS_JSON repository variable before building distributable packages." >&2
            exit 1
          fi
          echo "ALPARTS_TRANSPORT_PINS_FILE=$pins_file" >> "$GITHUB_ENV"
      - name: Build Android and verify dependencies
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          pnpm android:build
          packages/android/gradlew -p packages/android assembleRelease
      - name: Prepare reviewable release metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SEQUENCE: ${{ github.run_number }}
        run: |
          mkdir -p dist/android-release
          cp packages/android/app/build/outputs/apk/release/app-release-unsigned.apk dist/android-release/alparts-android-unsigned.apk
          pnpm release:prepare dist/android-release development "$RELEASE_SEQUENCE" dist/android-release/alparts-android-unsigned.apk
      - name: Attest isolated build outputs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/android-release/*'
      # Pull requests still build and test; only manual runs keep the outputs.
      - name: Confirm the build outputs exist
        run: ls -l packages/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: github.event_name == 'workflow_dispatch'
        with:
          name: alparts-android-review
          path: |
            packages/android/app/build/outputs/apk/debug/*.apk
            packages/android/app/build/reports/
            dist/android-release/
          if-no-files-found: error
          retention-days: 14
