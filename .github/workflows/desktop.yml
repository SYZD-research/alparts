name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/client/**
      - packages/desktop/**
      - packages/shared/**

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            target: linux
          - platform: Windows
            os: windows-2022
            target: windows
          - platform: macOS
            os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    # A failed hdiutil attempt can take about eight minutes before it errors.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.8.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alparts/desktop typecheck
      - run: pnpm --filter @alparts/desktop test
      - name: Provide transport pins
        shell: bash
        env:
          CONFIGURED_PINS: ${{ vars.ALPARTS_TRANSPORT_PINS_JSON }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          pins_file="$RUNNER_TEMP/transport-pins.json"
          if [[ -n "$CONFIGURED_PINS" ]]; then
            printf '%s\n' "$CONFIGURED_PINS" > "$pins_file"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Build check only: random pins for a reserved name that never resolves,
            # so the package cannot connect anywhere and is never distributable.
            node -e 'const p=()=>require("node:crypto").randomBytes(32).toString("base64");console.log(JSON.stringify({version:1,hosts:{"ci-build-check.alparts.invalid":[p(),p()]}}))' > "$pins_file"
          else
            echo "Set the ALPARTS_TRANSPORT_PINS_JSON repository variable before building distributable packages." >&2
            exit 1
          fi
          echo "ALPARTS_TRANSPORT_PINS_FILE=$pins_file" >> "$GITHUB_ENV"
      - name: Build packages
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          if [[ "$TARGET" != macos ]]; then
            exec pnpm --filter @alparts/desktop run "dist:$TARGET"
          fi
          # GitHub's macOS runners intermittently fail hdiutil while creating
          # the DMG (actions/runner-images#12323). Retry only that failure, and
          # keep Spotlight from indexing the volumes being built.
          sudo mdutil -a -i off >/dev/null || true
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/desktop-dist-$attempt.log"
            if pnpm --filter @alparts/desktop run dist:macos 2>&1 | tee "$log"; then exit 0; fi
            grep -qE 'hdiutil: .*(Device not configured|Resource busy)' "$log" || exit 1
            echo "::warning::hdiutil failed while creating the DMG (attempt $attempt of 3); retrying"
            rm -f packages/desktop/release/*.dmg packages/desktop/release/*.dmg.blockmap
          done
          exit 1
      # Pull requests still build every package; only manual runs keep them,
      # since each run's packages exceed the repository's artifact storage.
      - name: Confirm the packages were built
        shell: bash
        run: |
          shopt -s nullglob
          packages=(packages/desktop/release/*.{AppImage,deb,exe,dmg,zip})
          (( ${#packages[@]} > 0 )) || { echo 'No desktop package was produced' >&2; exit 1; }
          ls -l "${packages[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'workflow_dispatch'
        with:
          name: alparts-${{ matrix.target }}-unsigned
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
