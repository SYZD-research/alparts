name: AI issue maintenance

# When a maintainer adds the ai-fix label to an issue, a model on OpenRouter
# tries to resolve it and proposes the change as a draft PR that closes the
# issue. If it cannot, it says why on the issue and removes the label. The
# model sees the issue as it was when the label was added, and only the
# comments written by maintainers. If the issue was edited after that, nothing
# runs until the label is added again. A manual run takes an issue number and
# uses the issue as it is then.
#
# Trust: plan and agent have read-only repository access, and only the agent
# step holds the OpenRouter key. Checks in the agent job run code the model
# wrote, so they only catch honest mistakes, and every command the agent runs
# is sandboxed (scripts/maintenance/sandbox.mjs): it cannot reach the key,
# other processes or the files later steps run, and only the audit check
# reaches the network. The agent job keeps no dependency cache, so nothing
# from the change reaches the caches other workflows restore. publish, which
# can write, enforces the writable paths with the checker from the base
# commit and never runs code from the change.
#
# Setup: the same OPENROUTER_API_KEY secret and settings as
# maintenance-deps.yml.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-maintenance-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

env:
  LABEL: ai-maintenance
  FIX_LABEL: ai-fix

jobs:
  plan:
    if: github.event_name != 'issues' || github.event.label.name == 'ai-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      work: ${{ steps.collect.outputs.work }}
      number: ${{ steps.collect.outputs.number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.8.0"
      - name: Pick the issue
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
          KEY_SET: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$KEY_SET" != true ]; then
            echo "::notice::OPENROUTER_API_KEY is not set, so there is nothing to do."
            echo work=false >>"$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create "$FIX_LABEL" --color 1D76DB --description "AI に修正を任せる Issue" --force >/dev/null
          mkdir -p "$RUNNER_TEMP/task"
          snapshot=()
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            # The issue as the maintainer saw it when adding the label.
            jq '.issue | {title, body}' "$GITHUB_EVENT_PATH" >"$RUNNER_TEMP/snapshot.json"
            snapshot=(--snapshot "$RUNNER_TEMP/snapshot.json")
          fi
          node scripts/maintenance/collect.mjs issue --number "$NUMBER" "${snapshot[@]}" >"$RUNNER_TEMP/collect.json"
          notice=$(jq -r '.notice // empty' "$RUNNER_TEMP/collect.json")
          if [ -n "$notice" ]; then echo "::notice::$notice"; fi
          # The task carries issue text from GitHub, which the agent treats
          # as data.
          jq -r '.task // empty' "$RUNNER_TEMP/collect.json" >"$RUNNER_TEMP/task/task.md"
          jq -r '.outputs | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/collect.json" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outputs.work == 'true'
        with:
          name: maintenance-task
          path: ${{ runner.temp }}/task/task.md
          if-no-files-found: error
          retention-days: 7

  agent:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.8.0"
      - name: Set up the command sandbox
        run: |
          set -euo pipefail
          # Ubuntu 24.04 lets only programs with an AppArmor profile use the
          # user namespaces the sandbox is built on.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap >/dev/null
          # The agent's commands can rewrite the repository, so the steps
          # after it use this copy.
          cp -R scripts/maintenance "$RUNNER_TEMP/tools"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-task
          path: ${{ runner.temp }}/task
      - name: Run the maintenance agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAINTENANCE_MODEL: ${{ vars.MAINTENANCE_MODEL || 'deepseek/deepseek-v4.1-flash-1017' }}
        run: node scripts/maintenance/agent.mjs --mode issue --task "$RUNNER_TEMP/task/task.md" --output "$RUNNER_TEMP/maintenance"
      - name: Collect the change
        id: result
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/maintenance"
          git add --all
          if [ "$(cat "$out/changed")" = true ] && ! git diff --cached --quiet \
            && [ -s "$out/title.txt" ] && [ -s "$out/body.md" ]; then
            git diff --cached --binary >"$out/change.patch"
            git diff --cached --stat
            echo changed=true >>"$GITHUB_OUTPUT"
          else
            echo changed=false >>"$GITHUB_OUTPUT"
          fi
      # Re-run the checks on the final tree; the agent's own runs are not
      # trusted to have covered its last edit.
      - name: Verify the change
        if: steps.result.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          node "$tools/check-paths.mjs"
          for check in lint typecheck test security:secrets; do
            node "$tools/sandbox.mjs" -- pnpm "$check"
          done
          git diff --cached --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.result.outputs.changed == 'true'
        with:
          name: maintenance-change
          path: |
            ${{ runner.temp }}/maintenance/change.patch
            ${{ runner.temp }}/maintenance/title.txt
            ${{ runner.temp }}/maintenance/body.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.result.outputs.changed != 'true'
        with:
          name: maintenance-reason
          path: ${{ runner.temp }}/maintenance/reason.md
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [plan, agent]
    if: needs.agent.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.8.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-change
          path: ${{ runner.temp }}/maintenance
      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL: ${{ vars.MAINTENANCE_MODEL || 'deepseek/deepseek-v4.1-flash-1017' }}
          ISSUE: ${{ needs.plan.outputs.number }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/maintenance"
          # Use the path check from the base commit: the patch may replace it.
          cp -R scripts/maintenance "$RUNNER_TEMP/path-check"
          git apply --index "$dir/change.patch"
          node "$RUNNER_TEMP/path-check/check-paths.mjs"

          branch="ai-maintenance/issue-${ISSUE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -F - <<EOF
          $(cat "$dir/title.txt")

          Closes #$ISSUE

          Generated by the AI issue maintenance workflow ($MODEL).
          EOF
          git push origin "$branch"

          {
            cat "$dir/body.md"
            printf '\nCloses #%s\n\n---\n' "$ISSUE"
            printf 'CI は自動で実行されます。デスクトップと Android のビルドは、この PR を一度閉じて開き直すと実行されます。\n\n'
            printf 'この PR は AI による保守で作成されました（%s）。内容を確認してからマージしてください。\n%s\n' "$MODEL" "$RUN_URL"
          } >"$dir/pr-body.md"
          gh label create "$LABEL" --color 5319E7 --description "AI による定期保守" --force >/dev/null
          url=$(gh pr create --draft --base "$GITHUB_REF_NAME" --head "$branch" --label "$LABEL" \
            --title "$(cat "$dir/title.txt")" --body-file "$dir/pr-body.md")
          gh issue comment "$ISSUE" --body "修正案の PR を作りました: $url"
          # Pull requests opened with the workflow token start no workflows.
          gh workflow run ci.yml --ref "$branch"

  report:
    needs: [plan, agent]
    if: needs.agent.result == 'success' && needs.agent.outputs.changed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: maintenance-reason
          path: ${{ runner.temp }}/reason
      - name: Explain on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.plan.outputs.number }}
        run: |
          set -euo pipefail
          reason="$RUNNER_TEMP/reason/reason.md"
          {
            echo "AI による自動修正では対応できませんでした。"
            if [ -s "$reason" ]; then echo; head -c 2000 "$reason" | sed -e '$a\'; fi
            echo
            echo "もう一度任せる場合は、$FIX_LABEL ラベルを付け直してください。"
          } >"$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" --remove-label "$FIX_LABEL"
