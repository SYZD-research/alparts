name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          # Advanced Security is not enabled for this repository, so results
          # cannot be uploaded to code scanning. Keep the SARIF as an artifact
          # and fail the job on findings instead of leaving them in the log.
          upload: never
          output: codeql-results
      - name: Fail on CodeQL findings
        run: |
          set -euo pipefail
          count=$(jq '[.runs[].results[]?] | length' codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]? | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif >&2
            echo "CodeQL reported $count finding(s)." >&2
            exit 1
          fi
      # Kept for inspection only; the step above decides the result, so a full
      # artifact store must not fail (or skip) the findings check.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn
          retention-days: 7
