name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          # Advanced Security is not enabled for this repository, so results
          # cannot be uploaded to code scanning. Keep the SARIF as an artifact
          # and fail the job on findings instead of leaving them in the log.
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn
          retention-days: 30
      - name: Fail on CodeQL findings
        run: |
          set -euo pipefail
          count=$(jq '[.runs[].results[]?] | length' codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]? | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif >&2
            echo "CodeQL reported $count finding(s)." >&2
            exit 1
          fi
