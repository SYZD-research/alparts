name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          # Keep the SARIF on disk so the job can still fail on findings
          # instead of leaving them in the log. It is uploaded below, after
          # the accepted findings are taken out.
          upload: never
          output: codeql-results
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.8.0"
      # Findings accepted after review are listed with their reasons in
      # scripts/ci/codeql-accepted.mjs (risk register R-065). Only those exact
      # paths are taken out, matched by rule, file and the code of each path's
      # source; any other finding, including a new path to the same place,
      # still fails the job below.
      - name: Take out accepted findings
        run: node scripts/ci/codeql-accepted.mjs codeql-results
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: codeql-results
      - name: Fail on CodeQL findings
        run: |
          set -euo pipefail
          count=$(jq '[.runs[].results[]?] | length' codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]? | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif >&2
            echo "CodeQL reported $count finding(s)." >&2
            exit 1
          fi
      # Kept for inspection only; the step above decides the result, so a full
      # artifact store must not fail (or skip) the findings check.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn
          retention-days: 7
