name: AI documentation maintenance

# Weekly run that brings the dirdoc descriptions up to date with the code and
# proposes them as a draft PR. scripts/maintenance/docs-drift.mjs finds, from
# the git history, the files and directories in the areas the maintenance
# agent may change whose code changed after their description or that have
# none; a model on OpenRouter rewrites a batch of them. Descriptions of files
# that are gone are removed without the model. Nothing runs while an earlier
# PR from this workflow is open.
#
# Trust: plan and agent have read-only repository access, and only the agent
# step holds the OpenRouter key. The agent can change nothing but
# descriptions, and only through dirdoc, which validates them; every command
# it runs is sandboxed (scripts/maintenance/sandbox.mjs) without the network.
# publish, which can write, accepts only descriptions with the checker from
# the base commit and never runs code from the change.
#
# Setup: the same OPENROUTER_API_KEY secret and settings as
# maintenance-deps.yml.

on:
  schedule:
    - cron: "41 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-maintenance-docs
  cancel-in-progress: false

env:
  LABEL: ai-maintenance

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      work: ${{ steps.collect.outputs.work }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.8.0"
      - name: Collect the work
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_SET: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$KEY_SET" != true ]; then
            echo "::notice::OPENROUTER_API_KEY is not set, so there is nothing to do."
            echo work=false >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/task"
          node scripts/maintenance/collect.mjs docs >"$RUNNER_TEMP/collect.json"
          jq -r '.task // empty' "$RUNNER_TEMP/collect.json" >"$RUNNER_TEMP/task/task.md"
          jq -r '.outputs | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/collect.json" | tee -a "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/task/task.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outputs.work == 'true'
        with:
          name: maintenance-task
          path: ${{ runner.temp }}/task/task.md
          if-no-files-found: error
          retention-days: 7

  agent:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.8.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Install dirdoc
        run: bash scripts/maintenance/install-dirdoc.sh
      - name: Set up the command sandbox
        run: |
          set -euo pipefail
          # Ubuntu 24.04 lets only programs with an AppArmor profile use the
          # user namespaces the sandbox is built on.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap >/dev/null
          # The agent's commands can rewrite the repository, so the steps
          # after it use this copy.
          cp -R scripts/maintenance "$RUNNER_TEMP/tools"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-task
          path: ${{ runner.temp }}/task
      - name: Remove the descriptions of files that are gone
        run: |
          set -euo pipefail
          node scripts/maintenance/docs-drift.mjs --prune
          git add --all
          echo "MAINTENANCE_SNAPSHOT=$(git write-tree)" >>"$GITHUB_ENV"
      - name: Run the maintenance agent
        id: agent
        # The removals above are still proposed if the model fails.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAINTENANCE_MODEL: ${{ vars.MAINTENANCE_MODEL || 'deepseek/deepseek-v4.1-flash-1017' }}
        run: node scripts/maintenance/agent.mjs --mode docs --task "$RUNNER_TEMP/task/task.md" --output "$RUNNER_TEMP/maintenance"
      - name: Collect the change
        id: result
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/maintenance"
          mkdir -p "$out"
          if [ "$AGENT_OUTCOME" != success ]; then
            # Keep only the removals; drop whatever the model left half done.
            git read-tree -u --reset "$MAINTENANCE_SNAPSHOT"
            git clean -fdq
            rm -f "$out/title.txt" "$out/body.md"
            echo "説明の書き直しは途中で止まったため、削除されたファイルの説明の削除だけを含めています。" >"$out/reason.md"
          fi
          git add --all
          if git diff --cached --quiet; then
            echo changed=false >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ -s "$out/title.txt" ] || echo "dirdoc の説明をコードに合わせて更新" >"$out/title.txt"
          if [ ! -s "$out/body.md" ]; then
            {
              echo "削除されたファイルの dirdoc の説明を取り除きました。"
              if [ -s "$out/reason.md" ]; then echo; cat "$out/reason.md"; fi
            } >"$out/body.md"
          fi
          git diff --cached --binary >"$out/change.patch"
          git diff --cached --stat
          echo changed=true >>"$GITHUB_OUTPUT"
      # Re-run the checks on the final tree; the agent's own runs are not
      # trusted to have covered its last edit.
      - name: Verify the change
        if: steps.result.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          node "$tools/check-paths.mjs" --docs-only
          node "$tools/sandbox.mjs" -- dirdoc check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.result.outputs.changed == 'true'
        with:
          name: maintenance-change
          path: |
            ${{ runner.temp }}/maintenance/change.patch
            ${{ runner.temp }}/maintenance/title.txt
            ${{ runner.temp }}/maintenance/body.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, agent]
    if: needs.agent.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.8.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-change
          path: ${{ runner.temp }}/maintenance
      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL: ${{ vars.MAINTENANCE_MODEL || 'deepseek/deepseek-v4.1-flash-1017' }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/maintenance"
          # Use the path check from the base commit: the patch may replace it.
          cp -R scripts/maintenance "$RUNNER_TEMP/path-check"
          git apply --index "$dir/change.patch"
          node "$RUNNER_TEMP/path-check/check-paths.mjs" --docs-only

          branch="ai-maintenance/docs-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -F - <<EOF
          docs: $(cat "$dir/title.txt")

          Generated by the AI documentation maintenance workflow ($MODEL).
          EOF
          git push origin "$branch"

          {
            cat "$dir/body.md"
            printf '\n---\n'
            printf 'この PR は AI による定期保守で作成されました（%s）。内容を確認してからマージしてください。\n%s\n' "$MODEL" "$RUN_URL"
          } >"$dir/pr-body.md"
          gh label create "$LABEL" --color 5319E7 --description "AI による定期保守" --force >/dev/null
          gh pr create --draft --base "$GITHUB_REF_NAME" --head "$branch" --label "$LABEL" \
            --title "$(cat "$dir/title.txt")" --body-file "$dir/pr-body.md"
          # Pull requests opened with the workflow token start no workflows.
          gh workflow run ci.yml --ref "$branch"
