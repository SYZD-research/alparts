packages:
  - 'packages/*'
  - 'setup'
allowBuilds:
  electron-winstaller: false
  esbuild: true
  mediasoup: true
overrides:
  esbuild: ^0.28.2
  qs: 6.16.1
  engine.io: 6.6.11
  fast-uri: 3.1.9
  undici@^6: 6.29.1
  undici@^7: 7.30.1
  brace-expansion@^1: 1.1.21
  brace-expansion@^2: 2.1.7
  brace-expansion@^5: 5.0.12
  http-cache-semantics@^4: 4.3.0
  # Only used by @electron/get 3 (through electron-builder) for proxy support
  # behind ELECTRON_GET_USE_PROXY. It pulls in sprintf-js, which has an
  # unfixed denial-of-service advisory (GHSA-hp3w-g68c-fv3c).
  global-agent: '-'
